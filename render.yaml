services:
  - type: web
    name: error-log-analyser-api
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: ANALYSIS_MODE
        value: direct
      - key: DATABASE_URL
        fromDatabase:
          name: error-log-analyser-db
          property: connectionString
      - key: CORS_ORIGIN
        fromService:
          name: error-log-analyser
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_NIM_BASE_URL
        value: https://integrate.api.nvidia.com/v1
      - key: NVIDIA_NIM_MODEL
        value: openai/gpt-oss-20b
      - key: NVIDIA_NIM_TIMEOUT_MS
        value: "45000"

  - type: web
    name: error-log-analyser
    runtime: static
    rootDir: Frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./build
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: 22.22.0
      - key: REACT_APP_API_URL
        fromService:
          name: error-log-analyser-api
          type: web
          envVarKey: RENDER_EXTERNAL_URL
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: error-log-analyser-db
    plan: free
    region: singapore
    postgresMajorVersion: "15"
    databaseName: error_log_analyser
    user: error_log_analyser
    ipAllowList: []
